name: test

# The smoke suite loads the real @companion-module/base, so it needs an install
# — unlike the dependency-free protocol tests in some sibling modules.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Packaging is a separate check: a module can pass every unit test and
      # still fail to build, which is how the 1.x runEntrypoint call used to
      # slip through.
      - run: npm run package
